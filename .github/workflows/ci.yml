name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint backend
        run: python -m ruff check .

      - name: Test backend
        run: python -m pytest

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

  containers:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - backend
      - frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Build production images
        run: docker compose --env-file .env.example build

      - name: Start PostgreSQL
        run: docker compose --env-file .env.example up -d db --wait --wait-timeout 60

      - name: Apply database migrations
        run: docker compose --env-file .env.example run --rm backend alembic upgrade head

      - name: Start application
        run: docker compose --env-file .env.example up -d --wait --wait-timeout 120

      - name: Verify application health
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3008/api/v1/health
          curl --fail --silent --show-error http://127.0.0.1:3008/api/v1/health/ready
          curl --fail --silent --show-error http://127.0.0.1:8088/health

      - name: Show container logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs --tail=200

      - name: Clean up containers
        if: always()
        run: docker compose --env-file .env.example down --volumes --remove-orphans

